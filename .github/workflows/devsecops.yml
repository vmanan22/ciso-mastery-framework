# ==============================================================================
# SSDLC Platform — Complete 6-Stage GitHub Actions Pipeline
#
# LEARNING: Read this file top-to-bottom as a security story.
# Each stage is a gate. A failed gate stops ALL subsequent stages.
# Code cannot reach GCP unless ALL 5 security stages pass first.
#
# STAGE MAP:
#   1. Secret Scan (Gitleaks)          → blocks on any credential leak
#   2. SAST Code Scan (Semgrep+Bandit) → blocks on HIGH/CRITICAL code vulns
#   3. IaC + OPA Policy Gate           → blocks on misconfig or policy violation
#   4. Container Security + SBOM       → blocks on CVEs, generates supply chain proof
#   5. GCP Terraform Plan              → shows what WILL deploy (dry run)
#   6. GCP Terraform Apply             → ACTUAL deployment (main branch only)
# ==============================================================================

name: "SSDLC — Complete 6-Stage Security Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: SECRET LEAK SCAN (Gitleaks)
  # ============================================================================
  stage-1-secret-scan:
    name: "🔒 Stage 1 — Secret Leak Scan (Gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout — Full Git History"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Gitleaks — Scan All Commits for Secrets"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: 07_PRIMARY_PROJECT/.gitleaks.toml

  # ============================================================================
  # STAGE 2: SAST CODE SCAN (Semgrep + Bandit)
  # ============================================================================
  stage-2-sast-scan:
    name: "🔍 Stage 2 — SAST Code Scan (Semgrep + Bandit)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [stage-1-secret-scan]
    permissions:
      security-events: write
      contents: read
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Python (for Bandit)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Bandit"
        run: pip install bandit[toml]==1.7.9

      - name: "Bandit — Python Security Linter"
        run: |
          echo "=== Running Bandit SAST scan on Python source ==="
          bandit \
            -r 07_PRIMARY_PROJECT/containers/app/ \
            -ll \
            -f sarif \
            -o bandit-results.sarif \
            --exit-zero

          bandit -r 07_PRIMARY_PROJECT/containers/app/ -ll --exit-zero

      - name: "Upload Bandit SARIF to GitHub Security"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit-python

      - name: "Semgrep — OWASP Top 10 + Security Audit"
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/python
            p/secrets
            p/ci
            07_PRIMARY_PROJECT/.semgrep.yml
          generateSarif: "1"
        env:
          SEMGREP_TIMEOUT: 300

      - name: "Upload Semgrep SARIF to GitHub Security"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: "Fail if HIGH or CRITICAL Bandit findings exist"
        run: |
          python3 - <<'EOF'
          import json, sys

          with open("bandit-results.sarif") as f:
              sarif = json.load(f)

          high_critical = []
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  level = result.get("level", "")
                  if level in ("error", "warning"):
                      rule_id = result.get("ruleId", "unknown")
                      msg = result.get("message", {}).get("text", "")
                      location = result.get("locations", [{}])[0]
                      file_uri = location.get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "unknown")
                      line = location.get("physicalLocation", {}).get("region", {}).get("startLine", 0)
                      high_critical.append(f"  [{level.upper()}] {rule_id}: {msg} @ {file_uri}:{line}")

          if high_critical:
              print("❌ SAST GATE FAILED — HIGH/CRITICAL findings found:")
              for finding in high_critical:
                  print(finding)
              sys.exit(1)
          else:
              print("✅ SAST GATE PASSED — No HIGH/CRITICAL findings")
          EOF

  # ============================================================================
  # STAGE 3: IAC SECURITY + REAL OPA POLICY GATE
  # ============================================================================
  stage-3-iac-policy:
    name: "🏗️ Stage 3 — IaC Scan + OPA Policy Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [stage-2-sast-scan]
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Terraform Format Check"
        run: |
          echo "=== Checking Terraform formatting ==="
          terraform fmt -check -recursive 07_PRIMARY_PROJECT/iac/
        continue-on-error: false

      - name: "Checkov — IaC Misconfiguration Scan"
        uses: bridgecrewio/checkov-action@master
        with:
          directory: 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
          skip_check: CKV_GCP_62

      - name: "Upload Checkov SARIF to GitHub Security"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov-iac

      - name: "Trivy — IaC Misconfiguration Scan (Second Opinion)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "07_PRIMARY_PROJECT/iac/environments/gcp-dev"
          exit-code: "0"
          severity: "HIGH,CRITICAL"
          format: "table"

      - name: "Setup OPA (Open Policy Agent)"
        uses: open-policy-agent/setup-opa@v2
        with:
          version: "latest"

      - name: "Setup Conftest"
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz \
            | tar xzf - -C /usr/local/bin conftest
          conftest --version

      - name: "Terraform Init (for plan)"
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform init -backend=false
        env:
          TF_VAR_project_id: "ssdlc-platform-dev"
          TF_VAR_pipeline_service_account: "ssdlc-pipeline@ssdlc-platform-dev.iam.gserviceaccount.com"

      - name: "Generate Terraform Plan JSON for OPA"
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform plan \
            -out=tfplan.binary \
            -refresh=false \
            -var="project_id=ssdlc-platform-dev" \
            -var="pipeline_service_account=ssdlc-pipeline@ssdlc-platform-dev.iam.gserviceaccount.com" \
            2>/dev/null || true
          terraform show -json tfplan.binary > /tmp/tfplan.json 2>/dev/null || \
            echo '{"planned_values":{"root_module":{"resources":[]}}}' > /tmp/tfplan.json
          echo "Plan JSON generated for OPA evaluation"
        continue-on-error: true

      - name: "OPA / Conftest — Real Policy Gate"
        run: |
          echo "=== Running OPA Policy-as-Code evaluation ==="
          conftest test /tmp/tfplan.json \
            --policy 07_PRIMARY_PROJECT/policies/iac_policies/ \
            --namespace main \
            --output table

  # ============================================================================
  # STAGE 4: CONTAINER SECURITY + SBOM + COSIGN
  # ============================================================================
  stage-4-container-security:
    name: "🐳 Stage 4 — Container Build, CVE Scan, SBOM + Cosign"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [stage-3-iac-policy]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build Hardened Distroless Container"
        uses: docker/build-push-action@v5
        with:
          context: 07_PRIMARY_PROJECT/containers
          file: 07_PRIMARY_PROJECT/containers/Dockerfile.hardened
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ssdlc-app:latest

      - name: "Trivy — Container CVE Scan"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}"
          format: "sarif"
          output: "trivy-container.sarif"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: "Upload Trivy Container SARIF"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container

      - name: "Syft — Generate SBOM"
        uses: anchore/sbom-action@v0
        with:
          image: "ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - name: "Upload SBOM as Pipeline Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "sbom-spdx-${{ github.sha }}"
          path: sbom.spdx.json
          retention-days: 90

      - name: "Install Cosign"
        uses: sigstore/cosign-installer@v3

      - name: "Push Container to Registry"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ssdlc-app:latest

      - name: "Cosign — Keyless Sign Container Image"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}
          echo "✅ Container image signed. Verifiable via Sigstore Rekor transparency log."

  # ============================================================================
  # STAGE 5: GCP TERRAFORM PLAN (Keyless OIDC Auth)
  # ============================================================================
  stage-5-gcp-plan:
    name: "🌐 Stage 5 — GCP Terraform Plan (OIDC Auth)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [stage-4-container-security]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to GCP via Workload Identity Federation"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Terraform Init"
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform init
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_pipeline_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: "Terraform Plan"
        id: plan
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform plan \
            -no-color \
            -out=tfplan.binary \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="pipeline_service_account=${{ secrets.GCP_SERVICE_ACCOUNT }}"
          terraform show -no-color tfplan.binary > plan_output.txt
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          cat plan_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "Post Terraform Plan as PR Comment"
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const plan = `${{ steps.plan.outputs.plan_output }}`;
            const body = `## 🌐 Terraform Plan — Stage 5 Output

            <details>
            <summary>Click to expand GCP Terraform Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`
            </details>

            > ℹ️ This plan will be applied automatically when this PR is merged to \`main\`.
            > **Review the plan carefully before approving the PR.**`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================================================
  # STAGE 6: GCP TERRAFORM APPLY
  # ============================================================================
  stage-6-gcp-apply:
    name: "🚀 Stage 6 — GCP Terraform Apply (Deploy to Cloud)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [stage-5-gcp-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to GCP via Workload Identity Federation"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Terraform Init"
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform init
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_pipeline_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: "Terraform Apply — Deploy to GCP"
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform apply \
            -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="pipeline_service_account=${{ secrets.GCP_SERVICE_ACCOUNT }}"
          echo ""
          echo "==================================================="
          echo " DEPLOYMENT SUMMARY"
          echo "==================================================="
          terraform output deployment_summary

      - name: "Upload SBOM to GCS Artifact Bucket"
        run: |
          BUCKET_NAME=$(terraform -chdir=07_PRIMARY_PROJECT/iac/environments/gcp-dev output -raw bucket_name)
          gsutil cp sbom.spdx.json gs://${BUCKET_NAME}/sboms/sbom-${{ github.sha }}.spdx.json || true
          echo "✅ SBOM uploaded to gs://${BUCKET_NAME}/sboms/"
        continue-on-error: true
