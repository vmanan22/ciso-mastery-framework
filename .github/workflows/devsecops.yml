# ==============================================================================
# CLOS — 6-Stage Fail-Closed DevSecOps Pipeline
#
# DESIGN INVARIANTS:
# 1. Fail Closed: No '|| true', no '--soft-fail', no 'exit-code: 0' on security gates.
# 2. Immutable Proof: Every gate generates and retains machine-readable evidence (SARIF/JSON/SPDX).
# 3. Least Privilege: Default read-only permissions; write granted strictly where needed.
# 4. Zero False-Green: Skipped cloud deployment is explicitly reported as SKIPPED, not PASS.
# ==============================================================================

name: "CLOS — 6-Stage Fail-Closed Security Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # REGRESSION GATE: Pipeline Integrity & Anti-Masking Check
  # ============================================================================
  pipeline-integrity-check:
    name: "🛡️ Pipeline Integrity — Fail-Closed Verifier"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_gcp_creds: ${{ steps.check-gcp-creds.outputs.has_gcp_creds }}
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verify No Failure-Masking Patterns in Workflows"
        run: |
          python3 scripts/verify_fail_closed.py

      - name: "Detect GCP Cloud Credentials Availability"
        id: check-gcp-creds
        run: |
          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "has_gcp_creds=true" >> $GITHUB_OUTPUT
            echo "✅ GCP OIDC configuration detected in repository secrets."
          else
            echo "has_gcp_creds=false" >> $GITHUB_OUTPUT
            echo "ℹ️ GCP Workload Identity Provider not configured in repository secrets. Cloud deployment stages will be visibly skipped."
          fi

  # ============================================================================
  # STAGE 1: SECRET LEAK SCAN (Gitleaks)
  # ============================================================================
  stage-1-secret-scan:
    name: "🔒 Stage 1 — Secret Leak Scan (Gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pipeline-integrity-check]
    steps:
      - name: "Checkout — Full Git History"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Gitleaks — Deep Commit History Scan"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 2: SAST CODE SCAN & UNIT TEST GATE (Semgrep + Bandit + Unit Tests)
  # ============================================================================
  stage-2-sast-scan:
    name: "🔍 Stage 2 — SAST Code Scan & Unit Tests (Semgrep + Bandit)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [stage-1-secret-scan]
    permissions:
      security-events: write
      contents: read
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Dependencies & Test Toolchain"
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep bandit[toml] pytest httpx
          pip install -r 07_PRIMARY_PROJECT/containers/app/requirements.txt

      - name: "Run Microservice Security & Authentication Unit Tests"
        working-directory: 07_PRIMARY_PROJECT
        run: |
          echo "=== Running Microservice Authentication & Security Unit Tests ==="
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: "Test SAST Rules & Native Fail-Closed Gate"
        run: |
          semgrep --test --config 07_PRIMARY_PROJECT/.semgrep.yml tests/semgrep/routes.py
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: "Bandit — Python Security Analysis"
        run: |
          echo "=== Running Bandit Security Linter ==="
          bandit -r 07_PRIMARY_PROJECT/containers/app/ -lll --format json -o bandit-results.json
          cat bandit-results.json

      - name: "Semgrep — OWASP Top 10 & Custom Security Rules"
        run: |
          echo "=== Running Semgrep AST Analysis ==="
          bash scripts/run_semgrep.sh

      - name: "Upload Semgrep SARIF to GitHub Security"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: "Upload SAST Reports as Artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-evidence
          path: |
            bandit-results.json
            semgrep.sarif
          retention-days: 30

  # ============================================================================
  # STAGE 3: IAC SECURITY & OPA POLICY GATE
  # ============================================================================
  stage-3-iac-policy:
    name: "🏗️ Stage 3 — IaC Scan + OPA Policy Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [stage-2-sast-scan]
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Python & Security Linters"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Terraform Format Verification"
        run: |
          echo "=== Enforcing Terraform formatting standards ==="
          terraform fmt -check -recursive 07_PRIMARY_PROJECT/iac/

      - name: "Install Checkov & IaC Scanners"
        run: pip install checkov

      - name: "Checkov — IaC Security Scan (Fail-Closed)"
        run: |
          echo "=== Running Checkov IaC Security Analysis ==="
          checkov \
            -d 07_PRIMARY_PROJECT/iac/environments/gcp-dev \
            --framework terraform \
            --skip-check CKV_GCP_62 \
            --output cli

      - name: "Setup OPA & Conftest Policy Engine"
        run: |
          curl -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz \
            | tar xzf - -C /usr/local/bin conftest
          conftest --version

      - name: "Terraform Init (Dry-Run Mode)"
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform init -backend=false
        env:
          TF_VAR_project_id: "ssdlc-platform-dev"
          TF_VAR_pipeline_service_account: "ssdlc-pipeline@ssdlc-platform-dev.iam.gserviceaccount.com"

      - name: "Generate Terraform Plan JSON for OPA Gate"
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "ya29.mock_token_for_offline_dry_run_evaluation"
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform plan \
            -out=tfplan.binary \
            -refresh=false \
            -var="project_id=ssdlc-platform-dev" \
            -var="pipeline_service_account=ssdlc-pipeline@ssdlc-platform-dev.iam.gserviceaccount.com"
          terraform show -json tfplan.binary > /tmp/tfplan.json
          echo "✅ Authentic Terraform Plan JSON generated for OPA evaluation"


      - name: "OPA / Conftest — Policy-as-Code Evaluation (Fail-Closed)"
        run: |
          echo "=== Evaluating OPA Rego Security Invariants ==="
          conftest test /tmp/tfplan.json \
            --policy 07_PRIMARY_PROJECT/policies/iac_policies/ \
            --namespace main \
            --output table

  # ============================================================================
  # STAGE 4: CONTAINER SECURITY, SBOM & COSIGN
  # ============================================================================
  stage-4-container-security:
    name: "🐳 Stage 4 — Container Build, CVE Scan, SBOM + Cosign"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [stage-3-iac-policy]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build Hardened Distroless Container"
        uses: docker/build-push-action@v5
        with:
          context: 07_PRIMARY_PROJECT/containers
          file: 07_PRIMARY_PROJECT/containers/Dockerfile.hardened
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ssdlc-app:latest

      - name: "Trivy — Container CVE Scan (Fail-Closed on High/Critical)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: "Syft — Generate Software Bill of Materials (SBOM)"
        uses: anchore/sbom-action@v0
        with:
          image: "ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - name: "Upload SBOM as Pipeline Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "sbom-spdx-${{ github.sha }}"
          path: sbom.spdx.json
          retention-days: 90

      - name: "Install Cosign"
        uses: sigstore/cosign-installer@v3

      - name: "Push Container to Registry"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ssdlc-app:latest

      - name: "Cosign — Keyless Cryptographic Signature"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/ssdlc-app:${{ github.sha }}
          echo "✅ Container image cryptographically signed via Sigstore Fulcio/Rekor."

  # ============================================================================
  # STAGE 5: GCP TERRAFORM PLAN (Keyless OIDC Auth)
  # ============================================================================
  stage-5-gcp-plan:
    name: "🌐 Stage 5 — GCP Terraform Plan (OIDC Auth)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [stage-4-container-security, pipeline-integrity-check]
    if: needs.pipeline-integrity-check.outputs.has_gcp_creds == 'true'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to GCP via Workload Identity Federation"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Terraform Init & Plan (Fail-Closed Immutable Artifact)"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_pipeline_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          terraform init
          terraform plan \
            -no-color \
            -out=tfplan.binary \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="pipeline_service_account=${{ secrets.GCP_SERVICE_ACCOUNT }}"
          sha256sum tfplan.binary > tfplan.sha256
          echo "✅ Immutable Terraform plan & SHA-256 digest generated."

      - name: "Upload Terraform Plan Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "gcp-tfplan-${{ github.sha }}"
          path: |
            07_PRIMARY_PROJECT/iac/environments/gcp-dev/tfplan.binary
            07_PRIMARY_PROJECT/iac/environments/gcp-dev/tfplan.sha256
          retention-days: 7

  # ============================================================================
  # STAGE 6: GCP TERRAFORM APPLY (Deploy to Cloud)
  # ============================================================================
  stage-6-gcp-apply:
    name: "🚀 Stage 6 — GCP Terraform Apply (Deploy to Cloud)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [stage-5-gcp-plan, pipeline-integrity-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.pipeline-integrity-check.outputs.has_gcp_creds == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to GCP via Workload Identity Federation"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Download Terraform Plan Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "gcp-tfplan-${{ github.sha }}"
          path: 07_PRIMARY_PROJECT/iac/environments/gcp-dev

      - name: "Verify Plan Integrity & Apply Immutable Plan"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_pipeline_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          cd 07_PRIMARY_PROJECT/iac/environments/gcp-dev
          echo "=== Verifying Plan Cryptographic Digest ==="
          sha256sum -c tfplan.sha256
          terraform init
          terraform apply tfplan.binary
          terraform output deployment_summary
